---
site:
  title: LB2759 - Unlocking the agentic future of AIOps with Ansible Automation Platform
  url: https://github.com/rhpds/agentic-aiops-aap-showroom.git
  start_page: modules::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/rh-summit-2025/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: ./content/supplemental-ui
    - path: partials/head-styles.hbs
      contents: |
        <link rel="stylesheet" href="{{{uiRootPath}}}/css/site.css">
        <style>
        .doc .imageblock{align-items:flex-start}
        .doc .imageblock img{border:1px solid #c0c4ca;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.15);background-color:#f0f1f3;padding:8px;width:auto !important;max-width:100%;height:auto}
        video{border:solid 1px black;box-shadow:0 4px 8px 0 rgba(0,0,0,.2),0 6px 20px 0 rgba(0,0,0,.19)}
        .doc{max-width:none}
        </style>

antora:
  extensions:
    - '@sntke/antora-mermaid-extension'

asciidoc:
  attributes:
    experimental: true
    page-pagination: true
    showroom-collection-version: v1.5.6
    
output:
  dir: ./www
