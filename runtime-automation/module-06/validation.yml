---
# Module 06 - Windows Events and AI-Driven Ticketing
# Validation: Checks durable outcomes for both Challenges via AAP REST API.
#
# Challenge 1 — AD Account Creation
#   Task 1: "Simulate AD Account Creation" job completed successfully
#   Task 2: "Windows: Create Mattermost Ticket" job completed successfully (EDA-triggered)
#
# Challenge 2 — Firewall Event with AI Enrichment
#   Task 3: "Simulate Windows Firewall Toggle" job completed successfully
#   Task 4: "Windows AI: Analyze and Ticket" job completed successfully (EDA + Granite LLM)
#
# Key extravars (injected by vm_workload_runtime_automation):
#   controller_url, controller_username, controller_password

- name: Module 06 - Windows Events and AI-Driven Ticketing Validation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    student_user: "{{ user | default('') }}"
    aap_user: "{{ controller_username | default('admin') }}"
    aap_pass: "{{ controller_password | default('') }}"
    aap_url:  "{{ controller_url | default('https://localhost') }}"

  tasks:

    # -------------------------------------------------------
    # Check 1 — "Simulate AD Account Creation" job succeeded
    # -------------------------------------------------------
    - name: Query AAP for successful Simulate AD Account Creation jobs
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/jobs/?job_template__name__icontains=Simulate+AD+Account+Creation&status=successful&page_size=5"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_ad_sim
      ignore_errors: true

    # -------------------------------------------------------
    # Check 2 — "Windows: Create Mattermost Ticket" job succeeded (EDA-triggered)
    # Note: name__icontains used because emoji prefix may be present in job name
    # -------------------------------------------------------
    - name: Query AAP for successful Windows Create Mattermost Ticket jobs
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/jobs/?name__icontains=Windows+Create+Mattermost+Ticket&status=successful&page_size=5"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_mm_ticket
      ignore_errors: true

    # -------------------------------------------------------
    # Check 3 — "Simulate Windows Firewall Toggle" job succeeded
    # -------------------------------------------------------
    - name: Query AAP for successful Simulate Windows Firewall Toggle jobs
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/jobs/?job_template__name__icontains=Simulate+Windows+Firewall+Toggle&status=successful&page_size=5"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_fw_sim
      ignore_errors: true

    # -------------------------------------------------------
    # Check 4 — "Windows AI: Analyze and Ticket" job succeeded (EDA + Granite LLM)
    # Granite inference can take up to 5 minutes — generous timeout on poll
    # -------------------------------------------------------
    - name: Query AAP for successful Windows AI Analyze and Ticket jobs
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/jobs/?name__icontains=Windows+AI+Analyze+and+Ticket&status=successful&page_size=5"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 60
        status_code: [200]
      register: r_ai_ticket
      ignore_errors: true

    # -------------------------------------------------------
    # Build result booleans
    # -------------------------------------------------------
    - name: Build task result facts
      ansible.builtin.set_fact:
        _task1_ok: >-
          {{ (r_ad_sim.json.count | default(0) | int) >= 1 }}
        _task2_ok: >-
          {{ (r_mm_ticket.json.count | default(0) | int) >= 1 }}
        _task3_ok: >-
          {{ (r_fw_sim.json.count | default(0) | int) >= 1 }}
        _task4_ok: >-
          {{ (r_ai_ticket.json.count | default(0) | int) >= 1 }}

    # -------------------------------------------------------
    # Validate — Challenge 1
    # -------------------------------------------------------
    - name: Validate Challenge 1 - AD Account Creation Event
      rhpds.ftl.validation_check:
        check: "{{ _task1_ok and _task2_ok }}"
        pass_msg: |
          Challenge 1 passed.
          Task 1: Simulate AD Account Creation job completed successfully.
          Task 2: Windows Create Mattermost Ticket job completed successfully (EDA-triggered).
        error_msg: |
          {{ 'Task 1: Simulate AD Account Creation job — ok' if _task1_ok else 'Task 1: Simulate AD Account Creation job NOT found as successful — run the job template from the AAP controller or click Solve.' }}
          {{ 'Task 2: Windows Create Mattermost Ticket job — ok' if _task2_ok else 'Task 2: Windows Create Mattermost Ticket job NOT found as successful — EDA may still be processing. Wait 60 seconds and click Validate again. If the problem persists, verify the Windows Events rulebook activation is Running in EDA.' }}

    # -------------------------------------------------------
    # Validate — Challenge 2
    # -------------------------------------------------------
    - name: Validate Challenge 2 - Windows Firewall Event with AI Enrichment
      rhpds.ftl.validation_check:
        check: "{{ _task3_ok and _task4_ok }}"
        pass_msg: |
          Challenge 2 passed.
          Task 3: Simulate Windows Firewall Toggle job completed successfully.
          Task 4: Windows AI Analyze and Ticket job completed successfully (EDA + Granite LLM).
        error_msg: |
          {{ 'Task 3: Simulate Windows Firewall Toggle job — ok' if _task3_ok else 'Task 3: Simulate Windows Firewall Toggle job NOT found as successful — run the job template from the AAP controller or click Solve.' }}
          {{ 'Task 4: Windows AI Analyze and Ticket job — ok' if _task4_ok else 'Task 4: Windows AI Analyze and Ticket job NOT found as successful — Granite LLM inference can take up to 5 minutes. Wait and click Validate again. If the problem persists, verify the EDA Windows Events activation is Running and the AI job template can reach the model endpoint.' }}
