---
# Module 00 - Section 1: Log Enrichment and Prompt Generation Workflow
# Validation: Verifies the student has completed all automatable steps:
#   1. WFJT "AI Insights and Lightspeed prompt generation" exists
#   2. That WFJT has exactly 4 workflow nodes
#   3. A workflow job for that WFJT completed with status=successful
#   4. JT "Lightspeed Remediation Playbook Generator" exists (downstream artifact)
#   5. WFJT "Remediation Workflow" exists (downstream artifact)
- name: Module-00 Validation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    student_user: "{{ lookup('env', 'USER') | default(user | default('')) }}"
    # ── Service URLs and credentials (from runner environment) ───────────────
    controller_url: "{{ lookup('env', 'CONTROLLER_URL') }}"
    controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
    controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
    aap_url: "{{ lookup('env', 'CONTROLLER_URL') }}"
    aap_user: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
    aap_pass: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"

  tasks:
    # -------------------------------------------------------
    # Check 1 — WFJT "AI Insights and Lightspeed prompt generation" exists
    # -------------------------------------------------------
    - name: Check WFJT "AI Insights and Lightspeed prompt generation" exists
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_templates/?name__icontains=AI+Insights"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 10
        status_code: 200
      register: r_wfjt
      failed_when: false

    - name: Set wfjt_id when found
      ansible.builtin.set_fact:
        wfjt_id: "{{ r_wfjt.json.results[0].id | default('') }}"
      when:
        - r_wfjt is not failed
        - r_wfjt.json.count | int > 0

    # -------------------------------------------------------
    # Check 2 — WFJT has exactly 4 workflow nodes
    # -------------------------------------------------------
    - name: Check workflow nodes count for the WFJT
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_template_nodes/?workflow_job_template={{ wfjt_id }}"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 10
        status_code: 200
      register: r_nodes
      when: wfjt_id is defined and wfjt_id | string | length > 0
      failed_when: false

    # -------------------------------------------------------
    # Check 3 — A workflow job for that WFJT completed successfully
    # -------------------------------------------------------
    - name: Check for a successful workflow job
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_jobs/?name__icontains=AI+Insights&status=successful"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 10
        status_code: 200
      register: r_wf_job
      failed_when: false

    # -------------------------------------------------------
    # Check 4 — JT "Lightspeed Remediation Playbook Generator" exists
    # -------------------------------------------------------
    - name: Check JT "Lightspeed Remediation Playbook Generator" exists
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/job_templates/?name__icontains=Lightspeed+Remediation+Playbook+Generator"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 10
        status_code: 200
      register: r_jt_remediation
      failed_when: false

    # -------------------------------------------------------
    # Check 5 — WFJT "Remediation Workflow" exists
    # -------------------------------------------------------
    - name: Check WFJT "Remediation Workflow" exists
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_templates/?name__icontains=Remediation+Workflow"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 10
        status_code: 200
      register: r_wfjt_remediation
      failed_when: false

    # -------------------------------------------------------
    # Build task result booleans
    # -------------------------------------------------------
    - name: Build task results
      ansible.builtin.set_fact:
        _task1_ok: "{{ r_wfjt is not failed and r_wfjt.json.count | default(0) | int >= 1 }}"
        _task2_ok: "{{ r_nodes is not skipped and r_nodes is not failed and r_nodes.json.count | default(0) | int == 4 }}"
        _task3_ok: "{{ r_wf_job is not failed and r_wf_job.json.count | default(0) | int >= 1 }}"
        _task4_ok: "{{ r_jt_remediation is not failed and r_jt_remediation.json.count | default(0) | int >= 1 }}"
        _task5_ok: "{{ r_wfjt_remediation is not failed and r_wfjt_remediation.json.count | default(0) | int >= 1 }}"

    # -------------------------------------------------------
    # Validate all tasks
    # -------------------------------------------------------
    - name: Validate all tasks
      validation_check:
        check: "{{ _task1_ok and _task2_ok and _task3_ok and _task4_ok and _task5_ok }}"
        pass_msg: |
          Task 1: Workflow job template "AI Insights and Lightspeed prompt generation" exists
          Task 2: Workflow has 4 nodes in a linear success chain
          Task 3: Workflow job completed successfully
          Task 4: Job template "Lightspeed Remediation Playbook Generator" exists
          Task 5: Workflow job template "Remediation Workflow" exists
        error_msg: |
          {{ 'Task 1: Workflow job template "AI Insights and Lightspeed prompt generation" found' if _task1_ok else 'Task 1: FAILED — workflow job template "AI Insights and Lightspeed prompt generation" not found. Create it in AAP under Automation > Templates, then click Validate again.' }}
          {{ 'Task 2: Workflow has 4 nodes configured' if _task2_ok else 'Task 2: FAILED — workflow does not have exactly 4 nodes (found ' + (r_nodes.json.count | default(0) | string) + '). Add all 4 job templates as linked nodes in the workflow visualizer.' }}
          {{ 'Task 3: Workflow job completed successfully' if _task3_ok else 'Task 3: FAILED — no successful workflow job found. Launch "AI Insights and Lightspeed prompt generation" from AAP or trigger "Break Apache" to let EDA start it, then wait for it to finish and click Validate again.' }}
          {{ 'Task 4: Job template "Lightspeed Remediation Playbook Generator" exists' if _task4_ok else 'Task 4: FAILED — "Lightspeed Remediation Playbook Generator" job template not found. This is created automatically when the workflow job completes successfully. Ensure Task 3 passes first.' }}
          {{ 'Task 5: Workflow job template "Remediation Workflow" exists' if _task5_ok else 'Task 5: FAILED — "Remediation Workflow" workflow job template not found. This is created automatically when the workflow job completes successfully. Ensure Task 3 passes first.' }}
