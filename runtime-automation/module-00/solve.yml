---
# Module 00 - Section 1: Log Enrichment and Prompt Generation Workflow
# Solve: Creates the "AI Insights and Lightspeed prompt generation" WFJT,
#        links 4 nodes in sequence, launches "Break Apache" to trigger EDA,
#        then waits for the workflow to complete and verifies downstream artifacts.
- name: Solve module-00
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # ── Service URLs and credentials (from runner environment) ───────────────
    controller_url: "{{ lookup('env', 'CONTROLLER_URL') }}"
    controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
    controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
    aap_url: "{{ lookup('env', 'CONTROLLER_URL') }}"
    aap_user: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
    aap_pass: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"

    # Human-readable workflow name (no emoji — looked up via icontains)
    wfjt_name: "AI Insights and Lightspeed prompt generation"

    # Job template names used in node lookup (icontains-safe)
    jt_apache_check: "Apache Service Status Check"
    jt_analyze: "RHEL AI: Analyze Incident"
    jt_mattermost: "Notify via Mattermost"
    jt_lightspeed_build: "Build Ansible Lightspeed Job Template"
    jt_break_apache: "Break Apache"

    # Downstream artifact names verified at the end
    jt_remediation_gen: "Lightspeed Remediation Playbook Generator"
    wfjt_remediation: "Remediation Workflow"

    # Common URI args
    _headers:
      Content-Type: application/json

  tasks:
    # ------------------------------------------------------------------
    # 0. Resolve the Default organization ID
    # ------------------------------------------------------------------
    - name: Get Default organization
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/organizations/?name=Default"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: 200
      register: r_org
      failed_when: false

    - name: Set default_org_id
      ansible.builtin.set_fact:
        default_org_id: "{{ r_org.json.results[0].id }}"
      when:
        - r_org is not failed
        - r_org.json.count | int > 0

    # ------------------------------------------------------------------
    # 1. Check if WFJT already exists (idempotency)
    # ------------------------------------------------------------------
    - name: Check if WFJT already exists
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_templates/?name__icontains=AI+Insights+and+Lightspeed+prompt"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: 200
      register: r_wfjt_check
      failed_when: false

    - name: Set wfjt_exists fact
      ansible.builtin.set_fact:
        wfjt_exists: "{{ r_wfjt_check.json.count | int > 0 }}"
        wfjt_id: "{{ r_wfjt_check.json.results[0].id | default('') }}"
      when: r_wfjt_check is not failed

    # ------------------------------------------------------------------
    # 2. Create WFJT if it does not exist
    # ------------------------------------------------------------------
    - name: Create WFJT "{{ wfjt_name }}"
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_templates/"
        method: POST
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers: "{{ _headers }}"
        body_format: json
        body:
          name: "{{ wfjt_name }}"
          organization: "{{ default_org_id }}"
        timeout: 30
        status_code: [200, 201]
      register: r_wfjt_create
      when:
        - default_org_id is defined
        - not (wfjt_exists | default(false) | bool)
      failed_when: false

    - name: Set wfjt_id from newly created WFJT
      ansible.builtin.set_fact:
        wfjt_id: "{{ r_wfjt_create.json.id }}"
      when:
        - r_wfjt_create is not skipped
        - r_wfjt_create is not failed
        - r_wfjt_create.json is defined

    # ------------------------------------------------------------------
    # 3. Resolve all 4 job template IDs needed for workflow nodes
    # ------------------------------------------------------------------
    - name: Lookup JT - Apache Service Status Check
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/job_templates/?name__icontains={{ jt_apache_check | urlencode }}"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: 200
      register: r_jt_apache
      failed_when: false

    - name: Lookup JT - RHEL AI Analyze Incident
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/job_templates/?name__icontains=Analyze+Incident"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: 200
      register: r_jt_analyze
      failed_when: false

    - name: Lookup JT - Notify via Mattermost
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/job_templates/?name__icontains=Notify+via+Mattermost"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: 200
      register: r_jt_mattermost
      failed_when: false

    - name: Lookup JT - Build Ansible Lightspeed Job Template
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/job_templates/?name__icontains=Build+Ansible+Lightspeed"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: 200
      register: r_jt_lightspeed_build
      failed_when: false

    - name: Set job template ID facts
      ansible.builtin.set_fact:
        jt_apache_id: "{{ r_jt_apache.json.results[0].id | default('') }}"
        jt_analyze_id: "{{ r_jt_analyze.json.results[0].id | default('') }}"
        jt_mattermost_id: "{{ r_jt_mattermost.json.results[0].id | default('') }}"
        jt_lightspeed_build_id: "{{ r_jt_lightspeed_build.json.results[0].id | default('') }}"
      when:
        - r_jt_apache is not failed
        - r_jt_analyze is not failed
        - r_jt_mattermost is not failed
        - r_jt_lightspeed_build is not failed

    # ------------------------------------------------------------------
    # 4. Check existing nodes and their link state (idempotency)
    #    Nodes need to be re-created if they exist but have no links.
    # ------------------------------------------------------------------
    - name: Check existing nodes for WFJT
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_template_nodes/?workflow_job_template={{ wfjt_id }}"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: 200
      register: r_existing_nodes
      when: wfjt_id | string | length > 0
      failed_when: false

    - name: Determine if nodes need to be created or re-linked
      ansible.builtin.set_fact:
        # Nodes are fully configured when count==4 AND at least one node has success_nodes
        nodes_fully_configured: >-
          {{
            r_existing_nodes.json.count | int == 4 and
            (r_existing_nodes.json.results | default([]) | selectattr('success_nodes', 'defined') |
             map(attribute='success_nodes') | select | list | length > 0)
          }}
        existing_node_count: "{{ r_existing_nodes.json.count | default(0) }}"
      when: r_existing_nodes is not skipped and r_existing_nodes is not failed

    # ------------------------------------------------------------------
    # 4a. Delete existing unlinked nodes so we can recreate them cleanly
    # ------------------------------------------------------------------
    - name: Delete existing unlinked nodes to allow clean recreation
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_template_nodes/{{ item.id }}/"
        method: DELETE
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [204, 404]
      loop: "{{ r_existing_nodes.json.results | default([]) }}"
      when:
        - r_existing_nodes is not skipped
        - r_existing_nodes is not failed
        - not (nodes_fully_configured | default(false) | bool)
        - existing_node_count | int > 0
      failed_when: false

    # ------------------------------------------------------------------
    # 5. Create Node 1 (root): Apache Service Status Check
    # ------------------------------------------------------------------
    - name: Create workflow node 1 - Apache Service Status Check
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_template_nodes/"
        method: POST
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers: "{{ _headers }}"
        body_format: json
        body:
          workflow_job_template: "{{ wfjt_id | int }}"
          unified_job_template: "{{ jt_apache_id | int }}"
          convergence: "any"
        timeout: 30
        status_code: [200, 201]
      register: r_node1
      when:
        - wfjt_id | string | length > 0
        - jt_apache_id | string | length > 0
        - not (nodes_fully_configured | default(false) | bool)
      failed_when: false

    - name: Set node1_id
      ansible.builtin.set_fact:
        node1_id: "{{ r_node1.json.id }}"
      when:
        - r_node1 is not skipped
        - r_node1 is not failed

    # ------------------------------------------------------------------
    # 6. Create Node 2: RHEL AI Analyze Incident
    # ------------------------------------------------------------------
    - name: Create workflow node 2 - RHEL AI Analyze Incident
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_template_nodes/"
        method: POST
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers: "{{ _headers }}"
        body_format: json
        body:
          workflow_job_template: "{{ wfjt_id | int }}"
          unified_job_template: "{{ jt_analyze_id | int }}"
        timeout: 30
        status_code: [200, 201]
      register: r_node2
      when:
        - wfjt_id | string | length > 0
        - jt_analyze_id | string | length > 0
        - not (nodes_fully_configured | default(false) | bool)
      failed_when: false

    - name: Set node2_id
      ansible.builtin.set_fact:
        node2_id: "{{ r_node2.json.id }}"
      when:
        - r_node2 is not skipped
        - r_node2 is not failed

    # ------------------------------------------------------------------
    # 7. Create Node 3: Notify via Mattermost
    # ------------------------------------------------------------------
    - name: Create workflow node 3 - Notify via Mattermost
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_template_nodes/"
        method: POST
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers: "{{ _headers }}"
        body_format: json
        body:
          workflow_job_template: "{{ wfjt_id | int }}"
          unified_job_template: "{{ jt_mattermost_id | int }}"
        timeout: 30
        status_code: [200, 201]
      register: r_node3
      when:
        - wfjt_id | string | length > 0
        - jt_mattermost_id | string | length > 0
        - not (nodes_fully_configured | default(false) | bool)
      failed_when: false

    - name: Set node3_id
      ansible.builtin.set_fact:
        node3_id: "{{ r_node3.json.id }}"
      when:
        - r_node3 is not skipped
        - r_node3 is not failed

    # ------------------------------------------------------------------
    # 8. Create Node 4: Build Ansible Lightspeed Job Template
    # ------------------------------------------------------------------
    - name: Create workflow node 4 - Build Ansible Lightspeed Job Template
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_template_nodes/"
        method: POST
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers: "{{ _headers }}"
        body_format: json
        body:
          workflow_job_template: "{{ wfjt_id | int }}"
          unified_job_template: "{{ jt_lightspeed_build_id | int }}"
        timeout: 30
        status_code: [200, 201]
      register: r_node4
      when:
        - wfjt_id | string | length > 0
        - jt_lightspeed_build_id | string | length > 0
        - not (nodes_fully_configured | default(false) | bool)
      failed_when: false

    - name: Set node4_id
      ansible.builtin.set_fact:
        node4_id: "{{ r_node4.json.id }}"
      when:
        - r_node4 is not skipped
        - r_node4 is not failed

    # ------------------------------------------------------------------
    # 9. Link nodes: Node 1 -> Node 2 (success)
    # ------------------------------------------------------------------
    - name: Link node 1 success to node 2
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_template_nodes/{{ node1_id }}/success_nodes/"
        method: POST
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers: "{{ _headers }}"
        body_format: raw
        body: "{{ {'id': node2_id | int} | to_json }}"
        timeout: 30
        status_code: [200, 201, 204]
      when:
        - node1_id is defined
        - node2_id is defined
        - not (nodes_fully_configured | default(false) | bool)
      failed_when: false

    # ------------------------------------------------------------------
    # 10. Link nodes: Node 2 -> Node 3 (success)
    # ------------------------------------------------------------------
    - name: Link node 2 success to node 3
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_template_nodes/{{ node2_id }}/success_nodes/"
        method: POST
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers: "{{ _headers }}"
        body_format: raw
        body: "{{ {'id': node3_id | int} | to_json }}"
        timeout: 30
        status_code: [200, 201, 204]
      when:
        - node2_id is defined
        - node3_id is defined
        - not (nodes_fully_configured | default(false) | bool)
      failed_when: false

    # ------------------------------------------------------------------
    # 11. Link nodes: Node 3 -> Node 4 (success)
    # ------------------------------------------------------------------
    - name: Link node 3 success to node 4
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_template_nodes/{{ node3_id }}/success_nodes/"
        method: POST
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers: "{{ _headers }}"
        body_format: raw
        body: "{{ {'id': node4_id | int} | to_json }}"
        timeout: 30
        status_code: [200, 201, 204]
      when:
        - node3_id is defined
        - node4_id is defined
        - not (nodes_fully_configured | default(false) | bool)
      failed_when: false

    # ------------------------------------------------------------------
    # 12. Re-fetch nodes to confirm final state
    # ------------------------------------------------------------------
    - name: Re-fetch nodes to confirm link state
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_template_nodes/?workflow_job_template={{ wfjt_id }}"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: 200
      register: r_nodes_final
      when: wfjt_id | string | length > 0
      failed_when: false

    - name: Set node_count fact
      ansible.builtin.set_fact:
        node_count: "{{ r_nodes_final.json.count | default(0) }}"
      when: r_nodes_final is not skipped and r_nodes_final is not failed

    # ------------------------------------------------------------------
    # 13. Lookup "Break Apache" JT and launch it
    # ------------------------------------------------------------------
    - name: Lookup Break Apache job template
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/job_templates/?name__icontains=Break+Apache"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: 200
      register: r_jt_break
      failed_when: false

    - name: Set break_apache_jt_id
      ansible.builtin.set_fact:
        break_apache_jt_id: "{{ r_jt_break.json.results[0].id | default('') }}"
      when:
        - r_jt_break is not failed
        - r_jt_break.json.count | int > 0

    - name: Launch Break Apache job template
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/job_templates/{{ break_apache_jt_id }}/launch/"
        method: POST
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers: "{{ _headers }}"
        body_format: json
        body: {}
        timeout: 30
        status_code: [200, 201]
      register: r_break_launch
      when: break_apache_jt_id | string | length > 0
      failed_when: false

    - name: Set break_job_id
      ansible.builtin.set_fact:
        break_job_id: "{{ r_break_launch.json.id | default('') }}"
      when:
        - r_break_launch is not skipped
        - r_break_launch is not failed

    # ------------------------------------------------------------------
    # 14. Poll Break Apache job until successful (max 3 minutes)
    # ------------------------------------------------------------------
    - name: Poll Break Apache job until complete
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/jobs/{{ break_job_id }}/"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: 200
      register: r_break_poll
      until: r_break_poll.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: 18
      delay: 10
      when: break_job_id | string | length > 0
      failed_when: false

    - name: Set break_job_status
      ansible.builtin.set_fact:
        break_job_status: "{{ r_break_poll.json.status | default('unknown') }}"
      when:
        - r_break_poll is not skipped
        - r_break_poll is not failed

    # ------------------------------------------------------------------
    # 15. Record when Break Apache finished (to find only NEW wf jobs)
    # ------------------------------------------------------------------
    - name: Get Break Apache job finish time as reference point
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/jobs/{{ break_job_id }}/"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: 200
      register: r_break_detail
      when: break_job_id | string | length > 0
      failed_when: false

    - name: Set break_finished_time reference
      ansible.builtin.set_fact:
        break_finished: "{{ r_break_detail.json.finished | default('1970-01-01T00:00:00Z') }}"
      when:
        - r_break_detail is not skipped
        - r_break_detail is not failed

    # ------------------------------------------------------------------
    # 15a. Give EDA 30s to detect the Apache failure, then check once.
    #      If EDA did not trigger, step 15b launches the WFJT directly.
    # ------------------------------------------------------------------
    - name: Pause 30s for EDA to detect the Apache failure
      ansible.builtin.pause:
        seconds: 30

    - name: Check if EDA triggered a new AI Insights workflow job
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_jobs/?name__icontains=AI+Insights&order_by=-id"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: 200
      register: r_eda_poll
      failed_when: false

    - name: Set eda_triggered fact
      ansible.builtin.set_fact:
        eda_triggered: >-
          {{
            r_eda_poll is not failed and
            r_eda_poll.json.count | int > 0 and
            (r_eda_poll.json.results[0].started | default('1970') > break_finished | default('1970'))
          }}

    # ------------------------------------------------------------------
    # 15b. If EDA did not trigger (EDA down/slow), launch WFJT directly
    # ------------------------------------------------------------------
    - name: Directly launch AI Insights WFJT if EDA did not trigger it
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_templates/{{ wfjt_id }}/launch/"
        method: POST
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers: "{{ _headers }}"
        body_format: json
        body: {}
        timeout: 30
        status_code: [200, 201]
      register: r_direct_launch
      when:
        - wfjt_id | string | length > 0
        - not (eda_triggered | default(false) | bool)
      failed_when: false

    - name: Set direct_launch_job_id fact
      ansible.builtin.set_fact:
        direct_launch_job_id: "{{ r_direct_launch.json.id | default('') }}"
      when:
        - r_direct_launch is not skipped
        - r_direct_launch is not failed

    # ------------------------------------------------------------------
    # 15c. Poll the running workflow job until complete (EDA or direct)
    # ------------------------------------------------------------------
    - name: Poll the AI Insights workflow job until complete
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_jobs/?name__icontains=AI+Insights&order_by=-id"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: 200
      register: r_wf_poll
      until: >
        r_wf_poll.json.count | int > 0 and
        r_wf_poll.json.results[0].status in ['successful', 'failed', 'error', 'canceled']
      retries: 30
      delay: 10
      failed_when: false

    - name: Set workflow_job_status fact
      ansible.builtin.set_fact:
        wf_job_status: "{{ r_wf_poll.json.results[0].status | default('not_found') }}"
        wf_job_id: "{{ r_wf_poll.json.results[0].id | default('') }}"
      when:
        - r_wf_poll is not failed
        - r_wf_poll.json.count | int > 0

    # ------------------------------------------------------------------
    # 16. Verify downstream artifacts created by the workflow
    # ------------------------------------------------------------------
    - name: Check Lightspeed Remediation Playbook Generator JT exists
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/job_templates/?name__icontains=Lightspeed+Remediation+Playbook+Generator"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: 200
      register: r_jt_remediation_gen
      failed_when: false

    - name: Check Remediation Workflow WFJT exists
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/workflow_job_templates/?name__icontains=Remediation+Workflow"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: 200
      register: r_wfjt_remediation
      failed_when: false

    - name: Set artifact facts
      ansible.builtin.set_fact:
        remediation_gen_jt_found: "{{ r_jt_remediation_gen.json.count | int > 0 }}"
        remediation_wfjt_found: "{{ r_wfjt_remediation.json.count | int > 0 }}"
      when:
        - r_jt_remediation_gen is not failed
        - r_wfjt_remediation is not failed

    # ------------------------------------------------------------------
    # 17. Report solve status
    # ------------------------------------------------------------------
    - name: Report solve status
      ansible.builtin.debug:
        msg: |
          WFJT "AI Insights and Lightspeed prompt generation": {{ 'ok (id=' + wfjt_id | string + ')' if wfjt_id | string | length > 0 else 'NOT ok - not found/created' }}
          Workflow nodes linked (count): {{ node_count | default('unknown') }}/4
