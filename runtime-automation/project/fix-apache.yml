---
# Stub: Fix Apache httpd on node1
# Removes the invalid directive inserted by break-apache.yml
# and restarts the service to restore normal operation.
- name: Fix Apache httpd service
  hosts: node1
  become: true
  tasks:
    - name: Remove invalid directive from httpd.conf
      ansible.builtin.lineinfile:
        path: /etc/httpd/conf/httpd.conf
        line: "InvalidDirectiveHere"
        state: absent

    - name: Restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted

    - name: Verify httpd is running
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
