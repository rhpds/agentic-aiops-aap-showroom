---
# Module 03 — Section 4: Event Driven Ansible
# Validation: Checks the "ospf-neighbor" EDA rulebook activation is in Running state.
- name: Module 03 - EDA ospf-neighbor Activation Validation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # ── Service URLs and credentials (from runner environment) ───────────────
    controller_url: "{{ lookup('env', 'CONTROLLER_URL') }}"
    controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
    controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
    eda_api_base: "{{ lookup('env', 'CONTROLLER_URL') }}/api/eda/v1"
    activation_name: "ospf-neighbor"

  tasks:

    # -------------------------------------------------------
    # Check 1 — EDA activation "ospf-neighbor" exists
    # -------------------------------------------------------
    - name: Query EDA activation by exact name
      ansible.builtin.uri:
        url: "{{ eda_api_base }}/activations/?name={{ activation_name }}"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
      register: r_exact
      failed_when: false

    - name: Broader search when exact returns nothing (icontains=ospf)
      ansible.builtin.uri:
        url: "{{ eda_api_base }}/activations/?name__icontains=ospf"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
      register: r_broad
      when:
        - r_exact.status | default(0) == 200
        - (r_exact.json.count | default(0)) == 0
      failed_when: false

    # -------------------------------------------------------
    # Build result facts
    # -------------------------------------------------------
    - name: Set activation result list
      ansible.builtin.set_fact:
        _activation_results: >-
          {{
            r_exact.json.results
            if (r_exact.json.count | default(0)) > 0
            else (r_broad.json.results | default([]))
          }}

    - name: Set activation status facts
      ansible.builtin.set_fact:
        _activation_found: "{{ (_activation_results | length) > 0 }}"
        _activation_status: "{{ (_activation_results | first).status | lower | default('not_found') }}"
      when: (_activation_results | length) > 0

    - name: Set activation not found
      ansible.builtin.set_fact:
        _activation_found: false
        _activation_status: "not_found"
      when: (_activation_results | default([]) | length) == 0

    - name: Build check boolean
      ansible.builtin.set_fact:
        _task1_ok: "{{ _activation_found | bool and _activation_status == 'running' }}"

    # -------------------------------------------------------
    # Validate
    # -------------------------------------------------------
    - name: Validate ospf-neighbor activation is running
      validation_check:
        check: "{{ _task1_ok }}"
        pass_msg: |
          Task 1: EDA rulebook activation "ospf-neighbor" exists and is in Running state
        error_msg: |
          {{ '[FAIL]' }} Task 1: EDA rulebook activation "ospf-neighbor" —
          {{ 'NOT FOUND — the activation was not provisioned. Contact your instructor or click Solve.' if not _activation_found | bool
             else 'status is "' + _activation_status + '" (expected "running") — go to AAP > Automation Decisions > Rulebook Activations, find "OSPF Neighbor", and enable it. Or click Solve to restore it automatically.' }}
