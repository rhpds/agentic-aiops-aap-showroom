---
# Module 03 — Debug probe: dumps runner environment so we can fix all playbooks
- name: Module 03 - Debug probe
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Dump all vars and env
      ansible.builtin.debug:
        msg:
          ansible_fqdn: "{{ ansible_fqdn | default('unknown') }}"
          ansible_hostname: "{{ ansible_hostname | default('unknown') }}"
          controller_url: "{{ controller_url | default('NOT_SET') }}"
          controller_username: "{{ controller_username | default('NOT_SET') }}"
          splunk_url: "{{ splunk_url | default('NOT_SET') }}"
          eda_webhook_url: "{{ eda_webhook_url | default('NOT_SET') }}"
          user: "{{ user | default('NOT_SET') }}"
          guid: "{{ guid | default('NOT_SET') }}"
          all_vars_keys: "{{ vars.keys() | list | sort }}"

    - name: Dump environment variables
      ansible.builtin.shell: env | sort
      register: r_env
      changed_when: false

    - name: Show environment
      ansible.builtin.debug:
        msg: "{{ r_env.stdout_lines }}"

    - name: Check /app directory
      ansible.builtin.shell: ls -la /app/ 2>/dev/null || echo "no /app"
      register: r_app
      changed_when: false

    - name: Show /app
      ansible.builtin.debug:
        msg: "{{ r_app.stdout_lines }}"

    - name: Check extra_vars files
      ansible.builtin.shell: |
        find /app /runner /home -name "extra_vars*" -o -name "*vars*.yml" 2>/dev/null | head -20
        cat /app/extra_vars 2>/dev/null || echo "no /app/extra_vars"
        cat /runner/env/extravars 2>/dev/null || echo "no /runner/env/extravars"
      register: r_vars
      changed_when: false

    - name: Show vars files
      ansible.builtin.debug:
        msg: "{{ r_vars.stdout_lines }}"

    - name: Check collections
      ansible.builtin.shell: ansible-galaxy collection list 2>/dev/null | head -30
      register: r_coll
      changed_when: false

    - name: Show collections
      ansible.builtin.debug:
        msg: "{{ r_coll.stdout_lines }}"
