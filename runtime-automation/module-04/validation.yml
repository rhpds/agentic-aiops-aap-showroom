---
# Module 04 - Section 5: Network Workflow (3 OSPF Challenges)
# Validation: Checks final durable state on cisco-rtr1 after all 3 challenges
# are complete and the Network-AIOps-Workflow ran successfully at least 3 times.
#
# All SSH to cisco-rtr1 is delegated to the bastion host.
# AAP API calls run from localhost (the runner container).

- name: Module 04 - Network Workflow OSPF Challenges Validation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    student_user: "{{ user | default('') }}"
    cisco_rtr_host: cisco-rtr1
    cisco_rtr_user: admin
    cisco_rtr_pass: "ansible123!"
    workflow_name: Network-AIOps-Workflow

  tasks:

    # -------------------------------------------------------
    # Check 1 — OSPF neighbor adjacency is FULL on Tunnel0
    # -------------------------------------------------------
    - name: Check OSPF neighbor adjacency on cisco-rtr1
      ansible.builtin.shell: |
        sshpass -p '{{ cisco_rtr_pass }}' ssh \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          {{ cisco_rtr_user }}@{{ cisco_rtr_host }} \
          'show ip ospf neighbor'
      register: r_ospf_neighbor
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 2 — OSPF network type is POINT_TO_POINT on Tunnel0
    # -------------------------------------------------------
    - name: Check OSPF interface type on Tunnel0
      ansible.builtin.shell: |
        sshpass -p '{{ cisco_rtr_pass }}' ssh \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          {{ cisco_rtr_user }}@{{ cisco_rtr_host }} \
          'sh ip ospf int tu0 | s Type'
      register: r_ospf_type
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 3 — OSPF hello interval is 10 on Tunnel0
    # -------------------------------------------------------
    - name: Check OSPF hello interval on Tunnel0
      ansible.builtin.shell: |
        sshpass -p '{{ cisco_rtr_pass }}' ssh \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          {{ cisco_rtr_user }}@{{ cisco_rtr_host }} \
          'sh ip ospf int tu0 | s Hello'
      register: r_ospf_hello
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 4 — Network-AIOps-Workflow ran successfully >= 3 times
    # -------------------------------------------------------
    - name: Query AAP for successful Network-AIOps-Workflow runs
      ansible.builtin.uri:
        url: "{{ controller_url }}/api/controller/v2/workflow_jobs/?name={{ workflow_name | urlencode }}&status=successful&page_size=100"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_workflow_jobs
      ignore_errors: true

    # -------------------------------------------------------
    # Build check results
    # -------------------------------------------------------
    - name: Build task results
      ansible.builtin.set_fact:
        _task1_ok: "{{ ('FULL' in (r_ospf_neighbor.stdout | default(''))) and ('Tunnel0' in (r_ospf_neighbor.stdout | default(''))) }}"
        _task2_ok: "{{ 'POINT_TO_POINT' in (r_ospf_type.stdout | default('')) }}"
        _task3_ok: "{{ 'Hello 10' in (r_ospf_hello.stdout | default('')) }}"
        _task4_ok: "{{ (r_workflow_jobs.json.count | default(0) | int) >= 3 }}"

    # -------------------------------------------------------
    # Validate all tasks
    # -------------------------------------------------------
    - name: Validate all tasks
      rhpds.ftl.validation_check:
        check: "{{ _task1_ok and _task2_ok and _task3_ok and _task4_ok }}"
        pass_msg: |
          Task 1: OSPF adjacency is FULL on Tunnel0 — Challenge 1 remediation confirmed
          Task 2: OSPF network type is POINT_TO_POINT on Tunnel0 — Challenge 2 remediation confirmed
          Task 3: OSPF hello interval is 10 on Tunnel0 — Challenge 3 remediation confirmed
          Task 4: Network-AIOps-Workflow completed successfully {{ r_workflow_jobs.json.count | default(0) }} time(s) (>= 3 required)
        error_msg: |
          {{ 'OK' if _task1_ok else 'FAILED' }} Task 1: OSPF adjacency FULL on Tunnel0 — {{ 'neighbor FULL detected' if _task1_ok else 'neighbor not FULL — re-run Challenge 1 or click Solve to restore tunnel0' }}
          {{ 'OK' if _task2_ok else 'FAILED' }} Task 2: OSPF network type POINT_TO_POINT on Tunnel0 — {{ 'type correct' if _task2_ok else 'type is not POINT_TO_POINT — re-run Challenge 2 or click Solve to restore network type' }}
          {{ 'OK' if _task3_ok else 'FAILED' }} Task 3: OSPF hello interval 10 on Tunnel0 — {{ 'hello interval correct' if _task3_ok else 'hello interval is not 10 — re-run Challenge 3 or click Solve to restore hello-interval' }}
          {{ 'OK' if _task4_ok else 'FAILED' }} Task 4: Network-AIOps-Workflow successful runs: {{ r_workflow_jobs.json.count | default(0) }}/3 required — {{ 'count met' if _task4_ok else 'complete all 3 challenges so EDA triggers the workflow each time' }}
